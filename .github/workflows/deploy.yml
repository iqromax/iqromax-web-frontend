name: Deploy Web Frontend to Production (iqromax.net)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 3. Install Node dependencies
        run: |
          npm install

      - name: 4. Build Production Bundle
        run: |
          npm run build

      - name: 5. Deploy dist folder to VPS via SSH
        uses: appleboy/rsync-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/"
          target: "/var/www/iqromax_mobile/iqromax-web-frontend/dist"
          delete: true
          args: "-avz"

      - name: 6. Reload Nginx on VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl reload nginx
